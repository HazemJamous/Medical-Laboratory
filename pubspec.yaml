name: midical_laboratory
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  
  mapbox_gl: ^0.16.0
  geolocator: ^9.0.2
  pdf: ^3.10.7
  printing: ^5.12.0
  path_provider: ^2.1.3
  open_filex: ^4.3.4
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  flutter_bloc: ^9.1.1
  dio: ^5.8.0+1
  get_it: ^8.0.3
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  flutter_rating_bar: ^4.0.0
  permission_handler: 12.0.1
  file_selector: 1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.0
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

dependency_overrides:
  image: ^4.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - fonts/Almarai-Regular.ttf

  fonts:
    - family: Almarai
      fonts:
        - asset: fonts/Almarai-Regular.ttf
